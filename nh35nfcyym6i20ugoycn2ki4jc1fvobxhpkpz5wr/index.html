<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>冊子検索</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #5d6675; --line: #d9dde4;
  --accent: #1f5fbf; --accent-soft: #e6eefb; --mark: #ffe58a; --warn-bg: #fff6df; --warn-ink: #6b4a00;
  --ocr: #7a4bb3; --ocr-soft: #f1eafb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --panel: #1c2027; --ink: #e6e9ee; --muted: #9aa3b2; --line: #2e3440;
    --accent: #7fb0ff; --accent-soft: #1f2d45; --mark: #6b5a12; --warn-bg: #3a3017; --warn-ink: #f3d98c;
    --ocr: #c7a6f2; --ocr-soft: #2c2340;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; }
body { background: var(--bg); color: var(--ink); font: 15px/1.7 "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; }
header { flex: none; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; }
h1 { font-size: 16px; margin: 0 0 6px; font-weight: 700; }
h1 small { font-weight: 400; color: var(--muted); margin-left: 8px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#q { flex: 1 1 280px; min-width: 0; font-size: 16px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
#q:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; min-height: 30px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
label.tog { font-size: 13px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.note { margin-top: 6px; font-size: 12.5px; color: var(--warn-ink); background: var(--warn-bg); padding: 4px 10px; border-radius: 6px; }
main { display: grid; grid-template-columns: minmax(260px, 360px) 1fr; flex: 1; min-height: 0; }
#list { overflow: auto; border-right: 1px solid var(--line); background: var(--panel); }
#count { font-size: 12.5px; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
.item { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; padding: 8px 12px; cursor: pointer; font: inherit; }
.item:hover { background: var(--bg); }
.item[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.item .top { display: flex; gap: 6px; align-items: baseline; font-size: 12.5px; color: var(--muted); }
.item .ttl { font-weight: 700; font-size: 14px; line-height: 1.5; }
.item .sn { font-size: 13px; color: var(--muted); line-height: 1.55; margin-top: 2px; overflow-wrap: anywhere; }
.badge { font-size: 11px; border-radius: 4px; padding: 0 5px; border: 1px solid var(--line); }
.badge.ocr { color: var(--ocr); border-color: var(--ocr); background: var(--ocr-soft); }
mark { background: var(--mark); color: inherit; padding: 0 1px; border-radius: 2px; }
#detail { overflow: auto; padding: 14px 16px 40px; }
#detail .meta { font-size: 13px; color: var(--muted); }
#detail h2.pt { font-size: 18px; margin: 2px 0 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
.actions a, .actions button { font-size: 13px; color: var(--accent); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; text-decoration: none; cursor: pointer; min-height: 32px; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.imgbox { position: sticky; top: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px; max-height: calc(100vh - 150px); overflow: auto; }
.imgbox img { width: 100%; display: block; cursor: zoom-in; background: #fff; }
.imgbox.zoom img { width: 200%; cursor: zoom-out; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.tab { border: 1px solid var(--line); border-bottom: 0; background: var(--bg); color: var(--muted); padding: 4px 10px; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 13px; }
.tab[aria-selected="true"] { background: var(--panel); color: var(--ink); font-weight: 700; }
.doc { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; overflow-wrap: anywhere; }
.doc h2 { font-size: 17px; margin: 10px 0 6px; } .doc h3 { font-size: 15.5px; margin: 10px 0 4px; } .doc h4, .doc h5, .doc h6 { font-size: 14.5px; margin: 8px 0 4px; }
.doc p { margin: 6px 0; } .doc ul { margin: 4px 0; padding-left: 1.3em; }
.doc blockquote { margin: 6px 0; padding: 4px 10px; border-left: 3px solid var(--accent); background: var(--accent-soft); }
.doc .tw { overflow-x: auto; } .doc table { border-collapse: collapse; font-size: 13.5px; margin: 6px 0; }
.doc th, .doc td { border: 1px solid var(--line); padding: 4px 6px; vertical-align: top; }
.doc th { background: var(--bg); }
.doc pre.raw { white-space: pre-wrap; font: 13px/1.6 "Yu Gothic UI", "Meiryo", sans-serif; margin: 0; }
.empty { color: var(--muted); padding: 30px 10px; text-align: center; }
@media (max-width: 900px) {
  body { display: block; height: auto; }
  main { display: block; }
  #list { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .split { grid-template-columns: 1fr; }
  .imgbox { position: static; max-height: none; }
}
</style>
</head>

    <label class="tog"><input type="checkbox" id="useOcr" checked>OCRも探す</label>
    <label class="tog"><input type="checkbox" id="showBlank">白紙も表示</label>
  </div>
  <div class="bar" style="margin-top:6px"><div class="chips" id="docs" role="group" aria-label="資料で絞る"></div></div>
  <div class="note">清書はAI（GPT・Claude）がページ画像から書き起こしたもの、OCRは機械の読み取りで誤りが多い。<b>金額・期限などを使うときは、必ずページ画像（またはPDF原本）で確かめる。</b></div>
</header>
<main>
  <nav id="list" aria-label="検索結果"><div id="count"></div><div id="items"></div></nav>

手持ちの未使用の葉書がないときは、配達不能のため、差出人に返還された選挙葉書を再び選挙葉書として使用することができます。\n\nこの場合には、返還印等を抹消し、表面の見やすいところに「再差出し」と朱記、又は再差出しであることを明らかにして、前記３の(2)により差し出すことになります。\n\nしたがって、頒布可能枚数全部を使用してしまった場合は、選挙葉書の再差出しはできませんので注意ください。\n\n### (10) 選挙葉書の特殊取扱い\n\n選挙葉書は、書留又は速達等の特殊取扱いとして差し出すことはできません。\n\n### (11) 選挙葉書の使用期間\n\n選挙葉書は、当該選挙の選挙運動の期間内に限り、これを使用することができるものですので、この期間を経過して差し出すことはできません。\n\nなお、未使用となった選挙葉書については、郵便局で回収いたしませんので、候補者様において処分等を行ってください。\n\n### (12) 選挙終了後返還される書損葉書\n\n選挙終了後に郵便局からお返しする書損葉書は、日本郵便株式会社の発行する通常葉書と交換することはできませんのでご承知おきください。\n\n## 4 お願い\n\n以上の事項は、推せん者又は知人等に選挙葉書の差出しをご依頼される場合にも、同様にご注意ください。\n\n特に、推せん者又は知人等の方が、選挙葉書の取扱いについて説明を受けていないとのことで、選挙葉書の郵便番号の前に「〒」の記号を印字している、選挙用の表示をする場所に文字又は線などがかかっている、選挙葉書をポストに投函される等の事例があることから、ご注意くださいますようお願いします。\n\n(1) 選挙葉書のご利用についてご不明な点がありましたら、交付・表示郵便局へお問い合わせください。お問い合わせの際は、直接、郵便局の責任者にお尋ね下さい。\n\n(2) 選挙事務所を設置された場合は、交付・表示郵便局と緊密にご連絡をとっていただき、選挙葉書の差し出し方法等について十分お打ち合わせの上、行き違いのないようお願いいたします。\n\nまた、選挙事務所を移転された場合も、最寄りの郵便局へご連絡ください。", "text_norm": "(7)郵便番号の記載受取人及び差出人の郵便番号を忘れずに記載していただきますようお願いします。(8)差出人名・差出人住所の記載差し出された選挙葉書のあて所が不明の場合等は、差出人に返還しますので、差出人名・差出人住所を記載していただきますようお願いします。(9)返還選挙葉書の再差出し選挙葉書の頒布可能枚数のうち、何枚かをまだ差し出していない場合で、お手持ちの未使用の葉書がないときは、配達不能のため、差出人に返還された選挙葉書を再び選挙葉書として使用することができます。この場合には、返還印等を抹消し、表面の見やすいところに「再差出し」と朱記、又は再差出しであることを明らかにして、前記3の(2)により差し出すことになります。したがって、頒布可能枚数全部を使用してしまった場合は、選挙葉書の再差出しはできませんので注意ください。(10)選挙葉書の特殊取扱い選挙葉書は、書留又は速達等の特殊取扱いとして差し出すことはできません。(11)選挙葉書の使用期間選挙葉書は、当該選挙の選挙運動の期間内に限り、これを使用することができるものですので、この期間を経過して差し出すことはできません。なお、未使用となった選挙葉書については、郵便局で回収いたしませんので、候補者様において処分等を行ってください。(12)選挙終了後返還される書損葉書選挙終了後に郵便局からお返しする書損葉書は、日本郵便株式会社の発行する通常葉書と交換することはできませんのでご承知おきください。4お願い以上の事項は、推せん者又は知人等に選挙葉書の差出しをご依頼される場合にも、同様にご注意ください。特に、推せん者又は知人等の方が、選挙葉書の取扱いについて説明を受けていないとのことで、選挙葉書の郵便番号の前に「〒」の記号を印字している、選挙用の表示をする場所に文字又は線などがかかっている、選挙葉書をポストに投函される等の事例があることから、ご注意くださいますようお願いします。(1)選挙葉書のご利用についてご不明な点がありましたら、交付・表示郵便局へお問い合わせください。お問い合わせの際は、直接、郵便局の責任者にお尋ね下さい。(2)選挙事務所を設置された場合は、交付・表示郵便局と緊密にご連絡をとっていただき、選挙葉書の差し出し方法等について十分お打ち合わせの上、行き違いのないようお願いいたします。また、選挙事務所を移転された場合も、最寄りの郵便局へご連絡ください。", "ocr_win_norm": "( 7 )郵便番号の記載受取人及び差出人の郵 ・各種料金払込み」等（※）を選択してください。\nその後は、画面の指示に従い、上記の電子納付情報表示画面で確認した「収納機関番号」、「納付番号」及び「確認番号」を入力し、納付手続を完了してください。\n\n※ メニュー名は金融機関によって異なります。\n\n※ インターネットバンキングの利用には、金融機関ごとに利用限度額が設定されていますので、納付する供託金額が利用限度額内であることを事前に確認してください。\n\n※ インターネットバンキングを利用するためには、御利用金融機関へのお申込みが必要です。\n\n※ 一部の国庫金取扱いのない金融機関のインターネットバンキングは、ペイジーに対応していても供託金の納付には対応していない場合（主にネット銀行等）がありますので、御注意ください。\n\n### ATMを利用する場合\n\n※ ATMに「収納機関番号」、「納付番号」及び「確認番号」を入力する必要があります。\nこのため、ATMを利用する際には、上記の電子納付情報表示画面を印刷するなどして、これらの番号をお手元に用意いただいて、手続を行ってください。\n\n※ ATMで電子納付を行うにはATMが「ペイジー」サービスに対応している必要があります。金融機関によってはATMが「ペイジー」サービスに対応していない場合がありますので、事前に、対応の有無を御利用金融機関に確認してください。\n\n※ ATMの利用には、金融機関ごとに利用限度額が設定されていますので、納付する供託金額が利用限度額内であることを事前に確認してください。\n\n【図】〈ゆうちょ銀行 ATMの画面例〉\n\n- 画面上部の案内: 〔判読不能〕\n- お預入れ\n- お引出し\n- 通帳記入\n- 残高照会\n- ご送金\n- 定額・定期お預入れ〔?〕\n- 〔判読不能〕\n- Pay-easy 税金・料金払込み〔?〕\n- 〔判読不能〕\n- 〔判読不能〕", "text_norm": "4供託金の納付法務局から受理決定通知書が届いたら、供託金の納付手続をとります。かんたん申請における供託金の納付は、「電子納付」の方法によって行います。「電子納付」とは、金融機関のATM又はインターネットバンキングを利用した納付方法です。納付手続に必要な番号を確認するには、処理状況照会画面から『納付』をクリックしてください。【図】処理状況照会画面件名申請番号申請日時処理状況納付状況供託(金銭)その他かんたん〔?〕〔判読不能〕2011/09/28 11:53:23〔?〕審査中未納付取得情報等〔?〕:〔判読不能〕納付:「納付」ボタン※照会内容確認(電子納付情報表示)画面が表示されますので、内容を確認の上、ATM又はインターネットバンキングを利用して納付手続をとってください。【図】照会内容確認(電子納付情報表示)画面電子納付に関する案内:〔判読不能〕申請番号:〔判読不能〕〔判読不能〕:〔判読不能〕申請者氏名〔?〕:〔判読不能〕件名:供託(金銭)その他【かんたん】〔?〕インターネットバンキングによるサービスのある個人〔?〕情報を確認し、下の納付情報を確認してください。〔?〕納付情報〔?〕: 2011年9月28日14時35分〔?〕納付状況:未納付収納機関番号: 00100納付番号:〔判読不能〕確認番号:〔判読不能〕納付額:〔判読不能〕円納付期限(最終年月日)〔?〕: 2011年10月7日〔?〕インターネットバンキングを利用して納付「電子納付」ボタン(金融機関を別画面で表示します)〔?〕「電子納付」ボタンをクリックすると金融機関を選ぶ画面が表示されますので、その後は画面の指示に従って納付を完了してください。〔?〕ペイジーマークを押して入口〔?〕で納付手続を開始する場合は右記の情報が必要となります。〔?〕「戻る(処理状況照会)」〔?〕※ATM又はインターネットバンキングは、Pay-easy(ペイジー)サービスに対応している必要がありますので、ご注意ください。Pay-easy※電子納付には納付期限(納付期限最終年月日)が設定されていますので、期限までに納付手続を終えてください。※納付期限を過ぎると供託の申請は失効しますので、御注意ください。インターネットバンキングを利用する場合※御利用口座金融機関のインターネットバンキングを利用する方法には、次の2通りの方法があります。いずれかの方法を選択して、納付手続を行ってください。1供託かんたん申請サイトから直接納付手続を行う方法上記の電子納付情報表示画面から、『電子納付』をクリックします。「e-Gov」サイトが別ウィンドウで開きますので、御利用金融機関を選択し、その後は画面の指示に従って納付手続を完了してください。2金融機関のサイトから納付手続を行う方法御利 ", "image": "db/pages/03-p001L.jpg"}, {"id": "03-p001R", "doc_id": "03", "pdf_page": 1, "side": "R", "printed_page": "", "kind": "本文", "title": "", "transcriber": "gpt-6-astra (codex exec)", "text_md": "この手引は、候補者の選挙運動の費用の一部を「小金井市議会議員及び小金井市長の選挙における選挙運動の公費負担に関する条例」の規定に基づき公費で負担することについて、その対象、限度額、請求手続き等を説明するものです。\n\n候補者及びこの候補者と契約を締結した契約業者等は、この手引の説明要領により間違いのないよう手続きをしてください。\n\n注１　この公費負担経費は、候補者が供託物を没収された場合には、支払いを請求することができませんので、ご留意ください。\n\n注２　事業者の印鑑は、契約書、請求書、支払金口座振替依頼書の依頼人の印と同一の印鑑にしてください。\n\n注３　費用の請求は、選挙期日後１５日以内に収支報告書と同時に提出（請求）するようお願いします。\n\n注４　公費負担の限度額は、消費税が含まれた金額です。\n\n注５　公費負担の支払いは、選挙確定後に書類が完全に整ったことを確認の上、支払いの手続きをとります。\n\nしたがって、小金井市から契約業者等に対して代金が支払われるまでには相当の期間を要します。あらかじめ、その旨を事業者に説明しておいてください。", "text_norm": "この手引は、候補者の選挙運動の費用の一部を「小金井市議会議員及び小金井市長の選挙における選挙運動の公費負担に関する条例」の規定に基づき公費で負担することについて、その対象、限度額、請求手続き等を説明するものです。候補者及びこの候補者と契約を締結した契約業者等は、この手引の説明要領により間違いのないよう手続きをしてください。注1この公費負担経費は、候補者が供託物を没収された場合には、支払いを請求することができませんので、ご留意ください。注2事業者の印鑑は、契約書、請求書、支払金口座振替依頼書の依頼人の印と同一の印鑑にしてください。注3費用の請求は、選挙期日後15日以内に収支報告書と同時に提出(請求)するようお願いします。注4公費負担の限度額は、消費税が含まれた金額です。注5公費負担の支払いは、選挙確定後に書類が完全に整ったことを確認の上、支払いの手続きをとります。したがって、小金井市から契約業者等に対して代金が支払われるまでには相当の期間を要します。あらかじめ、その旨を事業者に説明しておいてください。", "ocr_win_norm": "この手引は、候補者の選挙運動の費用の一部を「小金井市議会議員及び小金井市長の選挙における選挙運動の公費負担に関する条例」の規定に基づき公費で負担することについて、その対象、限度額、請求手続き等を説明するものです。候補者及びこの候補者と契約を締結した契約業者等は、この手引の説明要領により間違いのないよう手続きをしてください。注1この公費負担経費は、候補者が供託物を没収された場合には、支払いを請求することができませんので、ご留意ください。注2事業者の印鑑は、契約書、請求書、支払金口座振替依頼書の依頼人の印と同一の印鑑にしてください。注3費用の請求は、選挙期日後1 5日以内に収支報告書と同時に提出(請求)するようお願いします。注4公費負担の限度額は、消費税が含まれた金額です。注5公費負担の支払いは、選挙確定後に書類が完全に整ったことを確認の上、支払いの手続きをとります。したがって、小金井市から契約業者等に対して代金が支払われるまでには相当の期間を要します。あらかじめ、その旨を事業者に説明しておいてください。", "ocr_scan_norm": "この手引は、候補者の選挙運動の費用の一部を「小金井市議会議員及び小金井市長の選挙における選挙運動の公費負担に関する条例」の規定に基づき公費で負担することについて、その対象、限度額、請求手続き等を説明するものです。候補者及びこの候補者と契約を締結した契約業者等は、この手引の説明要領により間違いのないよう手続きをしてくださいo注1この公費負担経費は、候補者が供託物を没収'された場合には,支払いを請求することができませんので、ご留意ください。注2事業者の印鑑は、契約書、請求書、支払金口座振替依頼書の依頼人の印と同一の印鑑にしてください。注3費用の請求は、選挙期日後15日以内に収支報告書と同時に提出(請求)するようお願いします。注4公費負担の限度額は、消費税が含まれた金額です。注5公費負担の支払いは、選挙確定後に書類が完全に整ったことを確認の上、支払いの手続きをとります。したがって、小金井市から契約業者等に対して代金が支払われるまでには相当の期間を要します。あらかじめ、その旨を事業者に説明しておいてください。", "image": "db/pages/03-p001R.jpg"}, {"id": "03-p002", "doc_id": "03", "pdf_page": 2, "side": "", "printed_page": "1", "kind": "表", "title": "1 公費負担の対象とその限度額", "transcriber": "claude-sonnet (haisha-sonnet・拡大画像で数字照合)", "text_md": "(このページの上半分は90度回転した縦書きの目次、下半分は表。目次は紙面上は別ページ扱い。printed_page は表の下の「-1-」。)\n\n## 目次\n\n- 1 公費負担の対象とその限度額 …… 1\n- 2 公費負担手続図 …… 2\n- 3 公費負担の手続きについて\n  - (1) 契約締結の届出 …… 3\n  - (2) 確認申請 …… 4\n  - (3) 証明書の交付 …… 4\n  - (4) 費用の請求 …… 5\n- 参考1 [自動車燃料代確認書] …… 7\n- 参考2 [ビラ作成枚数確認書] …… 8\n- 参考3 [ポスター作成枚数確認書] …… 9\n\n## 1 公費負担の対象とその限度額\n\n表の列見出し: 「公費負担の対象」「公費負担の限度額」\n\n### 選挙運動用自動車\n\n(縦書きの欄名。右端の縦書きの欄「1の契約と2の契約は選択」は、1 と 2 の行全体にかかる。)\n\n#### 1 一般運送契約(ハイヤー等)\n\n- 公費負担の対象: 選挙運動用自動車として使用された各日の料金の合計金額(同一の日については1台に限る。)\n- 公費負担の限度額: 各日について 64,500円 64,500円×7日=451,500円 ①\n\n#### 2 その他の契約\n\n##### (1) 自動車借入契約(レンタル)\n\n- 公費負担の対象: 選挙運動用自動車として使用された各日の料金の合計金額(同一の日については1台に限る。)\n- 公費負担の限度額: 各日について 16,100円 16,100円×7日=112,700円 ②\n\n##### (2) 燃料供給の契約\n\n- 公費負担の対象: 選挙運動用自動車に供給された燃料の代金(代替車を含む。)\n- 公費負担の限度額: 7,700円 × 選挙運動の日数 7,700円×7日= 53,900円 ③\n\n##### (3) 運転手雇用契約\n\n- 公費負担の対象: 選挙運動用自動車の運転業務に従事した各日について支払う報酬の合計金額(同一の日については1人に限る。)\n- 公費負担の限度額: 各日について 12,500円 12,500円×7日= 87,500円 ④\n\n##### 2 その他の契約(1)〜(3)の限度額欄の右の枠(3行にまたがる)\n\n- ア 契約の相手方が生計を一にする親族である場合には、その者が当該契約に係る業務を業として行うものに限る。\n- イ 選挙運動期間中で、1(一般運送契約)を選択した日は、2(その他の契約)の計算では、選挙運動の日数から除いて計算する。\n- ②+③+④=254,100円 ⑤\n\n### ビラの作成\n\n- 公費負担の対象: 選挙管理委員会に届け出た2種類以内のビラ(A4版、29.7cm×21cm以内) 作成単価(8円38銭)に作成枚数(16,000枚以内)を乗じた金額\n- 公費負担の限度額: 公費負担限度額 @8.38円×16,000枚=134,080円 ⑥\n\n### ポスターの作成\n\n- 公費負担の対象: 当該候補者を通じて、作成単価(2,682円以内)に作成枚数(確認された枚数)を乗じた金額\n- 公費負担の限度額:\n  - ポスター掲示場数が151箇所の場合の単価\n  - (586円88銭×151箇所(ポスター掲示場数) + 316,250円) ÷ 151箇所(ポスター掲示場数) = 2,682円 (紙面は分数の形。分子が「586円88銭×151箇所(ポスター掲示場数) + 316,250円」、分母が「151箇所(ポスター掲示場数)」、右に「=2,682円」)\n  - 公費負担の限度額 @2,682円×151箇所 = 404,982円 ⑦\n\n### 通常葉書\n\n- 公費負担の対象: 選挙運動用通常葉書(公職選挙法に定める8,000枚の範囲内 出した額に100円未満の端数があるときは、その端数は切り上げて100円とします。この制限額は立候補届出の際にお知らせします。", "text_norm": "1選挙運動に関する収入・支出と支出制限額選挙には多額の経費を要します。したがって、これを無制限に放置しますと選挙が腐敗し、明るく正しい選挙の実現を妨げるおそれがあります。そこで、公職選挙法は、選挙運動に関する支出金額の制限額を定めて各候補者の選挙運動がその枠内において行われることを求めるとともに、候補者が選任した出納責任者にすべての収支を取り扱わせ、会計帳簿の記載、領収書等の徴収、収支の報告、報告書の公表等、選挙運動に関する収支を明確にし、経理面からも選挙の明朗化を図ろうとしています。収入・支出及び寄附の意義1収入収入とは、金銭、物品その他の財産上の利益の収受、その収受の承諾又は約束をいいます。これは、日常生活で使っている「収入」という言葉よりも広く、たとえば拡声機を無償で借りたときは、公職選挙法上では借上料を支払わなくても済むという利益を収受したことになりますので、借上料相当額は寄附としての収入になります。2寄附寄附とは、金銭、物品その他の財産上の利益の供与又は交付及びその約束で、党費、会費その他債務の履行としてなされるもの以外のものをいいます。ここにいう寄附とは、これを受ける者の側からいえば、収入の一種です。収入のうち特に寄附を区別したのは、その寄附者を明確にし、寄附による選挙運動資金の根源を選挙人に知らせようとする趣旨です。3支出支出とは、金銭、物品その他の財産上の利益の供与又は交付及びその約束をいいます。ここで注意していただきたい点は、たとえば選挙事務所、拡声機、労務等を無償で借用又は使用したときは、一方では寄附としての収入となり、他方ではその借上料、報酬等に相当する額を支出とみなすことです。4収入、支出の詳細については、「収支報告書記載上の留意事項」を参照してください。支出金額の制限額選挙運動に関する支出制限額は、次のように計算され、市選挙管理委員会が告示します。告示日の選挙人名簿登録者数×81円+ 310万円なお、支出制限額を算出した額に100円未満の端数があるときは、その端数は切り上げて100円とします。この制限額は立候補届出の際にお知らせします。", "ocr_win_norm": "1選挙運動に関する収入・支出と支出制限額選挙には多額の経費を要します。したがって、これを無制限に放置しますと選挙が腐敗し、明るく正しい選挙の実現を妨げるおそれがあります。そこで、公職選挙法は、選挙運動に関する支出金額の制限額を定めて各候補者の選挙運動がその枠内において行われることを求めるとともに、候補者が選任した出納責任者にすべての収支を取り扱わせ、会計帳簿の記載、領収書等の徴収、収支の報告、報告書の公表等、選挙運動に関する収支を明確にし、経理面からも選挙の明朗化を図ろうとしています。収入・支出及び寄1収入附の意義支出金額の制限額収入とは、金銭、物品その他の財産上の利益の収受、その収受の承諾又は約束をいいます。これは、日常生活で使っている「収入」という言葉よりも広く、たとえば拡声機を無償で借りたときは、公職選挙法上では借上料を支払わなくても済むという利益を収受したことになりますので、借上料相当額は寄附としての収入になります。2寄附寄附とは、金銭、物品その他の財産上の利益の供与又は交付及びその約束で、党費、会費その他債務の履行としてなされるもの以外のものをいいます。ここにいう寄附とは、これを受ける者の側からいえば、収入の一種です。収入のうち特に寄附を区別したのは、その寄附者を明確にし、寄附による選挙運動資金の根源を選挙人に知らせようとする趣旨です。3支出支出とは、金銭、物品その他の財産上の利益の供与又は交付及びその約束をいいます。ーこで注意していただきたい点は、たとえば選挙事務所、拡声機、労務等を無償で借用又は使用したときは、一方では寄附としての収入となり、他方ではその借上料、報酬等に相当する額を支出とみなすことです。4収入、支出の詳細については、「収支報告書記載上の留意事項」を参照してください。選挙運動に関する支出制限額は、次のように計算され、市選挙管理委員会が告示します。告示日の選挙人名簿登録者数>< 8 1円十3 1 0万円なお、支出制限額を算出した額に1 0 0円未満の端数があるときは、ー46ーにお知らせします。その端数は切り上げて1 0 0円とします。この制限額は立候補届出の際", "ocr_scan_norm": "", "image": "db/pages/05-p029R.jpg"}, {"id": "05-p030L", "doc_id": "05", "pd 利子補給金の交付の決定通知を受けた日から、利子補給金の交付の日から起算して1年経過した日又は交付決定の全部の取消通知を受けた日までの間、その会社その他の法人は、小金井市の選挙に関し寄附をしてはなりません。 |\n| 候補者等の寄附の禁止 | 1　選挙区内にある者に対する寄附<br>候補者は、小金井市内にある者に対して、いかなる名義でも寄附をすることはできません。ただし、政党その他の政治団体又はその支部親族に対する寄附、政治教育集会での実費補償（食事に係るものは不可）は除かれます。しかし、政治教育集会であっても、小金井市外で行うもの及び任期満了の日前９０日に当たる日から選挙期日までの間に行われるものでの実費補償は禁止されています。また、何人も候補者に対して、小金井市内にある者に対する寄附の勧誘・要求は禁止されています。 |\n| 候補者等の寄附の禁止 | 2　選挙区にある者に対する候補者名義の寄附<br>候補者以外の者が、小金井市内にある者に対して、候補者名義で寄附をすることはできません。ただし、親族に寄附する場合や候補者の政治教育集会での実費補償は除かれます。しかし、実費補償も任期満了の日前９０日に当たる日から選挙期日までの間は禁止されています。また何人も、候補者以外の者に対して、小金井市内にある者に対する候補者名義の寄附の勧誘・要求は禁止されています。 |\n| 候補者等の寄附の禁止 | 3　選挙区内にある者に対する社交の程度を超えた寄附<br>候補者が、小金井市内にある者に対して、結婚式の祝儀や葬式の香典を供与しても、候補者自身が出席した場合には罰せられませんが、その場合でも、その額が社交の程度を超える場合には処罰されます。 |", "text_norm": "1公職選挙法における寄附の制限項目内容特定の寄附の禁止1小金井市と請負等特別の利益を伴う契約の当事者である者は、小金井市の選挙に関し寄附することはできません。特定の寄附の禁止2会社その他の法人が、試験研究、調査及び災害復旧にかかるもの以外の融資を受けている場合において、その融資をしている者が、その融資につき小金井市から利子補給金の交付の決定を受けたときは、その利子補給金の交付の決定通知を受けた日から、利子補給金の交付の日から起算して1年経過した日又は交付決定の全部の取消通知を受けた日までの間、その会社その他の法人は、小金井市の選挙に関し寄附をしてはなりません。候補者等の寄附の禁止1選挙区内にある者に対する寄附候補者は、小金井市内にある者に対して、いかなる名義でも寄附をすることはできません。ただし、政党その他の政治団体又はその支部親族に対する寄附、政治教育集会での実費補償(食事に係るものは不可)は除かれます。しかし、政治教育集会であっても、小金井市外で行うもの及び任期満了の日前90日に当たる日から選挙期日までの間に行われるものでの実費補償は禁止されています。また、何人も候補者に対して、小金井市内にある者に対する寄附の勧誘・要求は禁止されています。候補者等の寄附の禁止2選挙区にある者に対する候補者名義の寄附候補者以外の者が、小金井市内にある者に対して、候補者名義で寄附をすることはできません。ただし、親族に寄附する場合や候補者の政治教育集会での実費補償は除かれます。しかし、実費補償も任期満了の日前90日に当たる日から選挙期日までの間は禁止されています。また何人も、候補者以外の者に対して、小金井市内にある者に対する候補者名義の寄附の勧誘・要求は禁止されています。候補者等の寄附の禁止3選挙区内にある者に対する社交の程度を超えた寄附候補者が、小金井市内にある者に対して、結婚式の祝儀や葬式の香典を供与しても、候補者自身が出席した場合には罰せられませんが、その場合でも、その額が社交の程度を超える場合には処罰されます。", "ocr_win_norm": "1公職選挙法における寄附の制限特定の寄附の禁止候補者等の寄附の1小金井市と請負等特別の利益を伴う契約の当事者である者は、小金井市の選挙に関し寄附することはできません。会社その他の法人が、試験研究、調査及び災害復旧にかかるもの以外の融資を受けている場合において、その融資をしている者が、その融資につき小金井市から利子補給金の交付の決定を受けたときは、その利子補給金の交付の決定通知を受けた日から、利子補給金の交付の日から起算して1年経過した日又は交付決定の全部の取消通知を受けた日までの間、その会社その他の法人は、小金井市の選挙に関し寄附をしてはなりません。1選挙区内にある者に対する寄附候補者は、小金井市内にある者に対して、いかなる名義でも寄附をすることはできません。ただし、政党その他の政治団体又はその支部親族に対する寄附、政治教育集会で 負等の契約の当事者に対する選挙に関する寄附の勧誘、要求は禁止されています。<br>(2) 小金井市からの利子補給の対象である融資を受けている会社、法人等に対する選挙に関する寄附の勧誘、要求は禁止されています。<br>2　だれもが受けてはいけない寄附<br>(1) 何人も、選挙に関し、小金井市と請負等の契約の当事者から、寄附を受けることが禁止されています。<br>(2) 何人も、選挙に関し、小金井市から利子補給の対象である融資を受けている会社・法人等から寄附を受けることは禁止されています。 |", "text_norm": "特定人に対する寄附の勧誘・要求等の禁止1勧誘・要求することが禁止されているもの(1)小金井市と請負等の契約の当事者に対する選挙に関する寄附の勧誘、要求は禁止されています。(2)小金井市からの利子補給の対象である融資を受けている会社、法人等に対する選挙に関する寄附の勧誘、要求は禁止されています。2だれもが受けてはいけない寄附(1)何人も、選挙に関し、小金井市と請負等の契約の当事者から、寄附を受けることが禁止されています。(2)何人も、選挙に関し、小金井市から利子補給の対象である融資を受けている会社・法人等から寄附を受けることは禁止されています。", "ocr_win_norm": "特定人に対する寄附の勧誘。要求等の禁止1勧誘。要求することが禁止されているもの( 1 )小金井市と請負等の契約の当事者に対する選挙に関する寄附の勧誘、要求は禁止されています。( 2 )小金井市からの利子補給の対象である融資を受けている会社、法人等に対する選挙に関する寄附の勧誘、要求は禁止されています。2だれもが受けてはいけない寄附( 1 )何人も、選挙に関し、小金井市と請負等の契約の当事者から、寄附を受けることが禁止されています。( 2 )何人も、選挙に関し、小金井市から利子補給の対象である融資を受けている会社・法人等から寄附を受けることは禁止されています。ー75ー", "ocr_scan_norm": "", "image": "db/pages/05-p045R.jpg"}, {"id": "05-p046L", "doc_id": "05", "pdf_page": 46, "side": "L", "printed_page": "76", "kind": "本文", "title": "2 政治資金規正法における寄附の制限", "transcriber": "gpt-6-astra (codex exec)", "text_md": "## 2 政治資金規正法における寄附の制限\n\n| 欄名 | 内容 |\n| --- | --- |\n| 寄附の量的制限等 | 1　会社等の寄附の制限<br>会社、労働組合、職員団体その他の団体（政治団体を除く）は、政党及び政治資金団体以外に対する政治活動に関する寄附が禁止されています。<br><br>2　公職の候補者の政治活動に関する寄附の禁止<br>公職の候補者に対する、政治活動に関する寄附（政党からの寄附及び選挙運動に関するものを除く）が禁止されています。<br><br>3　寄附の総額の制限（総枠制限）<br>個人がする寄附の限度額は、政党及び政治資金団体に対しては、年間２千万円、その他の政治団体及び公職の候補者に対しては、年間１千万円と定められており、合わせて１年間で３千万円までとなっています。<br>会社、労働組合などのする寄附の限度額は、資本金・組合員数等に応じて、政党及び政治資金団体に対しては年間７５０万円から１億円までとなっています。<br>政党及び政治資金団体以外の政治団体のする寄附の限度額は、同一の政治団体に対し、年間５千万円までと制限されています。<br><br>4　同一者に対する寄附の制限（個別制限）<br>個人のする寄附の限度額は、同一の者（団体）に対し年間１５０万円までと制限されています。ただし、政党及び政治資金団体に対しては個別制限がありません。<br>会社・労働組合・職員団体その他の団体は、政党・政治資金団体以外に対する寄附が禁止されています。<br><br>5　量的制限等に違反する寄附の受領の禁止<br>何人も、上記１～４に違反してされる寄附を受けてはなりません。 |\n| 寄附の質的制限 | 次に掲げるものは、政治活動（選挙運動を含む）に関する寄附が禁止されています。<br><br>1　特定の会社等の寄附の禁止<br>(1)　小金井市から、補助金・負担金・利子補給その他の給付金の決定を受けた会社その他の法人は、交付の決定を受けた日から１年間は政治活動（選挙運動を含む）に関する寄附をすることができません。<br>(2)　小金井市から、資本金・基本金その function renderMd(md) {
  const lines = md.split("\n"), html = []; let i = 0, para = [];
  const flush = () => { if (para.length) { html.push("<p>" + inline(para.join("")) + "</p>"); para = []; } };
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*$/.test(l)) { flush(); i++; continue; }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { flush(); const n = Math.min(6, m[1].length + 0); html.push(`<h${Math.max(2, n)}>${inline(m[2])}</h${Math.max(2, n)}>`); i++; continue; }
    if (/^\s*\|/.test(l)) {
      flush(); const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = (r) => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
      const isSep = (r) => /^\s*\|?\s*:?-{2,}/.test(r);
      let h = '<div class="tw"><table>'; let head = true;
      rows.forEach((r, k) => {
        if (isSep(r)) return;
        const tag = head && k + 1 < rows.length && isSep(rows[k + 1]) ? "th" : "td";
        h += "<tr>" + cells(r).map((c) => `<${tag}>${inline(c)}</${tag}>`).join("") + "</tr>"; head = false;
      });
      html.push(h + "</table></div>"); continue;
    }
    if (/^\s*>/.test(l)) {
      flush(); const q = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      html.push("<blockquote>" + q.map(inline).join("<br>") + "</blockquote>"); continue;
    }
    if (/^\s*[-*]\s+/.test(l)) {
      flush(); const stack = []; let out = "";
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        const mm = lines[i].match(/^(\s*)[-*]\s+(.*)$/); const d = Math.floor(mm[1].replace(/\t/g, "  ").length / 2);
        while (stack.length < d + 1) { out += "<ul>"; stack.push(1); }
        while (stack.length > d + 1) { out += "</ul>"; stack.pop(); }
        out += "<li>" + inline(mm[2]) + "</li>"; i++;
      }
      while (stack.length) { out += "</ul>"; stack.pop(); }
      html.push(out); continue;
    }
    para.push(l.trim()); i++;
  }
  flush(); return html.join("\n");
}
function highlight(root) {
  if (!terms.length) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const v = n.nodeValue, vn = v.normalize("NFKC"); if (vn.length !== v.length) continue;
    const hits = []; for (const t of terms) { let k = vn.indexOf(t); while (k >= 0) { hits.push([k, k + t.length]); k = vn.indexOf(t, k + 1); } }
    if (!hits.length) continue; hits.sort((a, b) => a[0] - b[0]);
    const frag = document.createDocumentFragment(); let pos = 0;
    for (const [a, b] of hits) { if (a < pos) continue; frag.append(v.slice(pos, a)); const m = document.createElement("mark"); m.textContent = v.slice(a, b); frag.append(m); pos = b; }
    frag.append(v.slice(pos)); n.replaceWith(frag);
  }
}
function show(id, push = true) {
  const p = DATA.pages.find((x) => x.id === id); if (!p) return;
  current = p; const d = DATA.docs[p.doc_id];
  document.querySelectorAll(".item").forEach((b) => b.setAttribute("aria-current", b.dataset.id === id ? "true" : "false"));
  const body = tab === "text" ? (p.text_md ? renderMd(p.text_md) : '<div class="empty">' + (p.kind === "白紙" ? "白紙のページ" : "まだ清書していない") + "</div>")
    : `<pre class="raw">${esc(tab === "win" ? p.ocr_win_norm : p.ocr_scan_norm) || "（文字なし）"}</pre>`;
  $("#detail").innerHTML = `
    <div class="meta">${esc(d.title)}（${esc(d.publisher)}）／ ${esc(pageLabel(p))} ／ ${esc(p.kind)} ／ ページID ${esc(p.id)}</div>
    <h2 class="pt">${esc(p.title || "（題なし）")}</h2>
    <div class="actions">
      ${d.file ? `<a href="${encodeURI(d.file)}#page=${p.pdf_page}" target="_blank" rel="noopener">PDF原本のこのページを開く</a>` : ""}
      <a href="${esc(p.image)}" target="_blank" rel="noopener">画像を別窓で開く</a>
      <button type="button" id="prev">← 前のページ</button><button type="button" id="next">次のページ →</button>
    </div>
    <div class="split">
      <div>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-tab="text" aria-selected="${tab === "text"}">清書</button>
          <button class="tab" role="tab" data-tab="win" aria-selected="${tab === "win"}">Windows OCR</button>
          <button class="tab" role="tab" data-tab="scan" aria-selected="${tab === "scan"}">スキャナーOCR</button>
        </div>
        <div class="doc" id="docbody">${body}</div>
        <div class="meta" style="margin-top:6px">清書: ${esc(p.transcriber || "なし")}</div>
      </div>
      <div class="imgbox" id="imgbox" title="クリックで拡大/縮小"><img src="${esc(p.image)}" alt="${esc(p.id)} のページ画像"></div>
    </div>`;
  highlight($("#docbody"));
  $("#imgbox").onclick = () => $("#imgbox").classList.toggle("zoom");
  document.querySelectorAll(".tab").forEach((b) => b.onclick = () => { tab = b.dataset.tab; show(current.id, false); });
  const idx = DATA.pages.indexOf(p);
  $("#prev").onclick = () => idx > 0 && show(DATA.pages[idx - 1].id);
  $("#next").onclick = () => idx < DATA.pages.length - 1 && show(DATA.pages[idx + 1].id);
  if (push) history.replaceState(null, "", "#" + id);
  $("#detail").scrollTop = 0;
}
function init() {
  const chips = [["", "すべて"], ...Object.keys(DATA.docs).map((k) => [k, docShort[k]])];
  $("#docs").innerHTML = chips.map(([k, n]) => `<button class="chip" data-doc="${k}" aria-pressed="${k === selDoc}">${esc(n)}</button>`).join("");
  $("#docs").onclick = (e) => { const b = e.target.closest(".chip"); if (!b) return; selDoc = b.dataset.doc; document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", c === b)); search(); };
  $("#items").onclick = (e) => { const b = e.target.closest(".item"); if (b) show(b.dataset.id); };
  let tmr; $("#q").oninput = () => { clearTimeout(tmr); tmr = setTimeout(() => { search(); if (current) show(current.id, false); }, 150); };
  $("#useOcr").onchange = search; $("#showBlank").onchange = search;
  document.addEventListener("keydown", (e) => { if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); } });
  search();
  const h = decodeURIComponent(location.hash.slice(1)); if (h) show(h, false);
}
init();
</script>
